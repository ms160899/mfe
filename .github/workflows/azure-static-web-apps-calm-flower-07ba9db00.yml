name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build:deploy

      - name: Resolve deploy directory
        run: |
          if [ -f dist/browser/index.html ]; then
            echo "DEPLOY_DIR=dist/browser" >> $GITHUB_ENV
          elif [ -f dist/browser/browser/index.html ]; then
            echo "DEPLOY_DIR=dist/browser/browser" >> $GITHUB_ENV
          else
            echo "Unable to find index.html in expected build paths"
            find dist -maxdepth 4 -type f | sort
            exit 1
          fi

      - name: Verify build output
        run: |
          echo "Deploy directory: $DEPLOY_DIR"
          ls -la "$DEPLOY_DIR/index.html"
          ls -la "$DEPLOY_DIR/remoteEntry.json"

      - name: Include SWA config in deploy directory
        run: |
          cp staticwebapp.config.json "$DEPLOY_DIR/staticwebapp.config.json"
          ls -la "$DEPLOY_DIR/staticwebapp.config.json"

      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FLOWER_07BA9DB00 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: "upload"
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: ${{ env.DEPLOY_DIR }} # Built app content directory
          api_location: "" # Api source code path - optional
          output_location: ""
          skip_app_build: true
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_CALM_FLOWER_07BA9DB00 }}
          action: "close"
